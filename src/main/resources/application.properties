spring.application.name=employee-management-backend
spring.datasource.url=jdbc:mysql://localhost:3306/employeedb
spring.datasource.username=root
spring.datasource.password=tiger

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Development defaults. Set JWT_SECRET and DB_PASSWORD environment variables before deployment.
app.jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-to-a-32-byte-minimum}
app.jwt.expiration-ms=28800000
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# CSV bulk-import limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
